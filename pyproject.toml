[project]
name = "gea-pemilu"
version = "0.1.0"
description = "HMTG GEA ITB election backbone"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.2,<5.3", "psycopg[binary]>=3.2,<4", "dj-database-url>=2.3,<4",
  "django-otp>=1.6,<2", "cryptography>=44,<48", "httpx>=0.28,<1",
  "whitenoise>=6.9,<7", "gunicorn>=23,<26", "python-dotenv>=1,<2", "polib>=1.2,<2",
  "standardwebhooks>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.10,<5", "ruff>=0.11,<1", "PyYAML>=6,<7", "jsonschema>=4,<5"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
exclude = [".venv", "output", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
