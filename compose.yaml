services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gea
      POSTGRES_USER: gea
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gea -d gea"]
      interval: 5s
      retries: 12
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
  web:
    build: .
    env_file: .env
    environment:
      DEBUG: "true"
      DATABASE_URL: postgresql://gea:local-development-only@db:5432/gea
      EMAIL_TRANSPORT: smtp
      EMAIL_HOST: mail
      EMAIL_PORT: "1025"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./output:/app/output
  outbox:
    build: .
    env_file: .env
    environment:
      DEBUG: "true"
      DATABASE_URL: postgresql://gea:local-development-only@db:5432/gea
      EMAIL_TRANSPORT: smtp
      EMAIL_HOST: mail
      EMAIL_PORT: "1025"
    command: ["python", "scripts/outbox_loop.py"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
